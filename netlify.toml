[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every unmatched path is served by the React router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
